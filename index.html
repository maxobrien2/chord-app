<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veggie Planting Guide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #2d6a4f;
      --green-mid: #40916c;
      --green-light: #74c69d;
      --green-pale: #d8f3dc;
      --green-bg: #f0faf3;
      --indoor-color: #4361ee;
      --indoor-light: #bac4f8;
      --outdoor-color: #2d6a4f;
      --outdoor-light: #95d5b2;
      --harvest-color: #f4a261;
      --harvest-light: #fde8d3;
      --frost-color: #90e0ef;
      --text: #1b2e24;
      --text-muted: #5a7a68;
      --border: #b7e4c7;
      --shadow: 0 2px 12px rgba(45,106,79,0.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--green-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
      color: white;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { margin-top: .4rem; opacity: .85; font-size: .95rem; }

    /* ── Controls ── */
    .controls {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      flex: 1;
      min-width: 180px;
    }
    .control-group label {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
    }
    .control-group select,
    .control-group input {
      padding: .55rem .75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .control-group select:focus,
    .control-group input:focus { border-color: var(--green-mid); }

    .filter-chips {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .chip {
      padding: .45rem .9rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--green-mid); background: var(--green-pale); }
    .chip.active { background: var(--green-mid); color: white; border-color: var(--green-mid); }

    /* ── Legend ── */
    .legend {
      max-width: 900px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      font-size: .8rem;
      color: var(--text-muted);
    }
    .legend-item { display: flex; align-items: center; gap: .4rem; }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 3px;
    }

    /* ── Calendar header ── */
    .calendar-header {
      max-width: 900px;
      margin: 1.25rem auto 0;
      padding: 0 1rem;
    }
    .calendar-header h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: .5rem;
    }

    .month-bar {
      display: grid;
      grid-template-columns: 200px repeat(12, 1fr);
      gap: 2px;
      font-size: .72rem;
      font-weight: 600;
      color: var(--text-muted);
      padding-bottom: 2px;
    }
    .month-bar span:first-child { /* veg name column */ }
    .month-bar .month-label {
      text-align: center;
    }
    .month-bar .month-label.frost-month {
      color: #0077b6;
    }

    /* ── Veg cards / rows ── */
    #veg-list {
      max-width: 900px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .veg-row {
      background: white;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .1s, box-shadow .1s;
    }
    .veg-row:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(45,106,79,0.14); }

    .veg-summary {
      display: grid;
      grid-template-columns: 200px repeat(12, 1fr);
      gap: 2px;
      align-items: center;
      cursor: pointer;
      padding: 2px;
    }

    .veg-name-cell {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .6rem .75rem;
      font-size: .9rem;
      font-weight: 600;
    }
    .veg-icon { font-size: 1.15rem; }
    .veg-category-badge {
      font-size: .65rem;
      padding: .15rem .4rem;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      margin-left: auto;
    }
    .badge-warm { background: #ffe8d0; color: #c05000; }
    .badge-cool { background: #d0e8ff; color: #004080; }

    .cal-cell {
      height: 36px;
      border-radius: 4px;
      position: relative;
    }
    .cal-cell.indoor  { background: var(--indoor-light); }
    .cal-cell.outdoor { background: var(--outdoor-light); }
    .cal-cell.harvest { background: var(--harvest-light); }
    .cal-cell.indoor-outdoor { background: linear-gradient(90deg, var(--indoor-light) 50%, var(--outdoor-light) 50%); }
    .cal-cell.frost-line {
      outline: 2px dashed var(--frost-color);
      outline-offset: -2px;
    }

    /* ── Expand panel ── */
    .veg-details {
      display: none;
      padding: 1rem 1rem 1rem 1.5rem;
      border-top: 1.5px solid var(--green-pale);
      background: var(--green-bg);
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }
    .veg-row.open .veg-details { display: grid; }

    .detail-section h3 {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: .4rem;
    }
    .detail-section p, .detail-section li {
      font-size: .88rem;
      line-height: 1.55;
      color: var(--text);
    }
    .detail-section ul { padding-left: 1.1rem; }
    .detail-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .7rem;
      border-radius: 8px;
      font-size: .82rem;
      font-weight: 600;
      margin-bottom: .5rem;
    }
    .badge-indoor  { background: var(--indoor-light); color: #1a2f9e; }
    .badge-outdoor { background: var(--outdoor-light); color: var(--green-dark); }
    .badge-harvest { background: var(--harvest-light); color: #8b3a00; }

    /* ── Empty state ── */
    #empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      display: none;
    }
    #empty-state .emoji { font-size: 3rem; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .month-bar, .veg-summary {
        grid-template-columns: 120px repeat(12, 1fr);
      }
      .veg-name-cell { padding: .5rem .4rem; font-size: .8rem; }
      .veg-category-badge { display: none; }
      .veg-details { grid-template-columns: 1fr; }
    }
  </style>
</head>

<header>

</header>

<div class="legend">

  <div class="legend-item"><div class="legend-dot" style="background:transparent;border:2px dashed var(--frost-color)"></div> Last frost month</div>
</div>

<div class="calendar-header">
  <div class="month-bar" id="month-bar">
    <span></span>

  </div>
</div>

<div id="veg-list"></div>
<div id="empty-state">

</div>

// ── State ────────────────────────────────────────────────────────────────────
let currentZone = 6;
let currentFilter = "all";
let currentSearch = "";

// ── Helpers ──────────────────────────────────────────────────────────────────
function lastFrostMonth(zone) {
  const z = ZONES[zone];
  return z.lastFrost ? z.lastFrost.m : null;
}

// Returns an array of 12 booleans: which months are "active" for a given activity
// weeksRelativeToFrost: negative = before frost, positive = after
// durationWeeks: how many weeks this activity spans
function monthsActive(weeksRelativeToFrost, durationWeeks, zone) {
  const frostM = lastFrostMonth(zone);
  if (frostM === null) {
    // No frost zone — just show from Jan based on typical schedule
    const startM = Math.max(0, 1);
    return buildMonthRange(startM, durationWeeks);
  }
  // Convert frost month to day-of-year, then compute start day
  const frostDay = frostM * 30.5;
  const startDay = frostDay + weeksRelativeToFrost * 7;
  const startM = Math.round(startDay / 30.5);
  return buildMonthRange(startM, durationWeeks);
}

function buildMonthRange(startM, durationWeeks) {
  const months = new Array(12).fill(false);
  const durationM = Math.ceil(durationWeeks / 4.3);
  for (let i = 0; i < durationM; i++) {
    const m = ((startM + i) % 12 + 12) % 12;
    months[m] = true;
  }
  return months;
}

// Clamp harvest window to the growing season
function harvestMonths(veg, zone) {
  const outdoorWeeks = veg.outdoor ? veg.outdoor.weeks : 0;
  const frostHardy = veg.frostHardy;

  // Start of outdoor window
  const frostM = lastFrostMonth(zone);
  if (frostM === null) {
    // No frost — harvest just after outdoor window
    const startDay = (outdoorWeeks * 7) + (veg.harvestDays[0]);
    return buildMonthRange(Math.round(startDay / 30.5), 6);
  }
  const frostDay = frostM * 30.5;
  const outdoorStartDay = frostDay + outdoorWeeks * 7;
  const harvestStartDay = outdoorStartDay + veg.harvestDays[0];
  const harvestEndDay   = outdoorStartDay + veg.harvestDays[1];
  const startM = Math.floor(harvestStartDay / 30.5);
  const endM   = Math.ceil(harvestEndDay / 30.5);
  const months = new Array(12).fill(false);
  for (let m = startM; m <= endM; m++) {
    const idx = ((m % 12) + 12) % 12;
    if (idx >= 0 && idx < 12) months[idx] = true;
  }
  return months;
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderMonthBar() {
  const bar = document.getElementById("month-bar");
  const frostM = lastFrostMonth(currentZone);
  bar.innerHTML = `<span></span>` + MONTHS.map((m, i) => {
    const isFrost = i === frostM;
    return `<span class="month-label${isFrost ? " frost-month" : ""}">${m}</span>`;
  }).join("");
}

function renderVeggies() {
  const list  = document.getElementById("veg-list");
  const empty = document.getElementById("empty-state");
  const zone  = currentZone;

  const filtered = VEGGIES.filter(v => {
    const matchSearch = currentSearch === "" ||
      v.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
      v.desc.toLowerCase().includes(currentSearch.toLowerCase());
    const matchFilter =
      currentFilter === "all" ||
      (currentFilter === "cool" && v.category === "cool") ||
      (currentFilter === "warm" && v.category === "warm") ||
      (currentFilter === "indoor" && v.indoor !== null);
    return matchSearch && matchFilter;
  });

  if (filtered.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  const frostM = lastFrostMonth(zone);

  list.innerHTML = filtered.map(veg => {
    const indoorMonths  = veg.indoor ? monthsActive(-(veg.indoor.weeks), 4, zone) : new Array(12).fill(false);
    const outdoorMonths = veg.outdoor ? monthsActive(veg.outdoor.weeks, 4, zone) : new Array(12).fill(false);
    const hvstMonths    = harvestMonths(veg, zone);

    const cells = MONTHS.map((_, i) => {
      const indr = indoorMonths[i];
      const outr = outdoorMonths[i];
      const hvst = hvstMonths[i];
      const isFrost = i === frostM;
      let cls = "cal-cell";
      if (indr && outr) cls += " indoor-outdoor";
      else if (indr)   cls += " indoor";
      else if (outr)   cls += " outdoor";
      else if (hvst)   cls += " harvest";
      if (isFrost)     cls += " frost-line";
      return `<div class="${cls}"></div>`;
    }).join("");

    const badge = veg.category === "warm"
      ? `<span class="veg-category-badge badge-warm">Warm</span>`
      : `<span class="veg-category-badge badge-cool">Cool</span>`;

    const indoorDetail = veg.indoor
      ? `<div class="detail-badge badge-indoor">🪴 Start Indoors</div>
         <p>${veg.indoor.tip}</p>`
      : `<p style="color:var(--text-muted);font-size:.85rem">Direct sow only — does not need indoor start.</p>`;

    const outdoorDetail = veg.outdoor
      ? `<div class="detail-badge badge-outdoor">🌿 Outdoor Planting</div>
         <p>${veg.outdoor.tip}</p>`
      : ``;

    const harvestDetail = `<div class="detail-badge badge-harvest">🌾 Harvest</div>
      <p>${veg.harvestDays[0]}–${veg.harvestDays[1]} days from transplant/sowing.</p>`;

    const tipsHtml = veg.tips.map(t => `<li>${t}</li>`).join("");

    return `
    <div class="veg-row" id="veg-${veg.name.replace(/\s+/g,'-')}">
      <div class="veg-summary" onclick="this.closest('.veg-row').classList.toggle('open')">
        <div class="veg-name-cell">
          <span class="veg-icon">${veg.icon}</span>
          <span>${veg.name}</span>
          ${badge}
        </div>
        ${cells}
      </div>
      <div class="veg-details">
        <div class="detail-section">
          <h3>Starting</h3>
          ${indoorDetail}
          <div style="margin-top:.75rem">${outdoorDetail}</div>
        </div>
        <div class="detail-section">
          <h3>Harvest</h3>
          ${harvestDetail}
          <p style="margin-top:.5rem;font-size:.85rem;color:var(--text-muted)">${veg.desc}</p>
        </div>
        <div class="detail-section">
          <h3>Growing Tips</h3>
          <ul>${tipsHtml}</ul>
        </div>
      </div>
    </div>`;
  }).join("");
}

function render() {
  renderMonthBar();
  renderVeggies();
}

// ── Events ───────────────────────────────────────────────────────────────────
document.getElementById("zone-select").addEventListener("change", e => {
  currentZone = parseInt(e.target.value, 10);
  render();
});

document.getElementById("search").addEventListener("input", e => {
  currentSearch = e.target.value;
  renderVeggies();
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    renderVeggies();
  });
});

// ── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
